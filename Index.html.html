<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Una pregunta para ti</title>
<style>
  :root{
    --bg-1:#2b0f18;
    --bg-2:#5c1a2e;
    --rose:#e8637a;
    --rose-light:#ffb3c1;
    --gold:#f4d58d;
    --cream:#fff3ec;
    --text:#3a1420;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg-1:#2b0f18;
      --bg-2:#5c1a2e;
    }
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%; width:100%;
    overflow:hidden;
    background: radial-gradient(ellipse at 50% 20%, var(--bg-2), var(--bg-1) 70%);
    font-family: "Iowan Old Style","Palatino Linotype", Georgia, serif;
    color: var(--cream);
  }
  .stage{
    position:relative;
    width:100%; height:100vh;
    display:flex; align-items:center; justify-content:center;
    flex-direction:column;
    text-align:center;
    padding: 24px;
  }
  .hearts{
    position:absolute; inset:0; pointer-events:none; overflow:hidden;
  }
  .heart{
    position:absolute;
    bottom:-10%;
    font-size: 22px;
    opacity:0.75;
    animation: float linear infinite;
    filter: drop-shadow(0 0 6px rgba(255,150,170,0.4));
  }
  @keyframes float{
    0%{ transform: translateY(0) translateX(0) rotate(0deg); opacity:0; }
    10%{ opacity:0.8; }
    90%{ opacity:0.6; }
    100%{ transform: translateY(-115vh) translateX(var(--drift,20px)) rotate(360deg); opacity:0; }
  }

  .card{
    position:relative;
    z-index:2;
    max-width: 480px;
    width: 100%;
  }

  .eyebrow{
    letter-spacing: 0.04em;
    font-size: 14px;
    color: var(--rose-light);
    margin-bottom: 6px;
    font-style: italic;
    opacity:0;
    animation: appear 1s ease forwards 0.2s;
  }

  h1{
    font-size: clamp(28px, 7vw, 44px);
    line-height:1.2;
    margin: 0 0 8px 0;
    font-weight: 500;
    color: var(--cream);
    opacity:0;
    animation: appear 1s ease forwards 0.6s;
  }

  .sub{
    font-size: 16px;
    color: var(--rose-light);
    margin-bottom: 34px;
    opacity:0;
    animation: appear 1s ease forwards 1.1s;
  }

  @keyframes appear{
    from{ opacity:0; transform: translateY(10px); }
    to{ opacity:1; transform: translateY(0); }
  }

  .buttons{
    display:flex;
    gap: 18px;
    justify-content:center;
    align-items:center;
    flex-wrap: wrap;
    opacity:0;
    animation: appear 1s ease forwards 1.5s;
    min-height: 70px;
  }

  button{
    font-family: inherit;
    border: none;
    cursor:pointer;
    border-radius: 999px;
    padding: 14px 30px;
    font-size: 17px;
    transition: transform 0.18s ease;
  }

  #yes{
    background: linear-gradient(135deg, var(--rose), #c73a56);
    color: var(--cream);
    box-shadow: 0 6px 20px rgba(199,58,86,0.45);
  }
  #yes:active{ transform: scale(0.96); }

  #no{
    background: transparent;
    color: var(--rose-light);
    border: 1px solid rgba(255,179,193,0.5);
    position: relative;
  }

  #final{
    display:none;
    z-index:2;
  }
  #final h1{ animation:none; opacity:1; }
  #final .sub{ animation:none; opacity:1; }

  .big-heart{
    font-size: 70px;
    animation: beat 1.1s ease-in-out infinite;
    margin-bottom: 10px;
    display:inline-block;
  }
  @keyframes beat{
    0%,100%{ transform: scale(1); }
    50%{ transform: scale(1.12); }
  }

  .confetti-heart{
    position:absolute;
    top:-10%;
    font-size: 20px;
    animation: fall linear forwards;
  }
  @keyframes fall{
    to{ transform: translateY(120vh) rotate(360deg); opacity: 0.2; }
  }

  @media (prefers-reduced-motion: reduce){
    .heart, .confetti-heart{ animation: none; display:none; }
    .big-heart{ animation:none; }
    h1,.sub,.eyebrow,.buttons{ animation:none; opacity:1; }
  }
</style>
</head>
<body>

<div class="hearts" id="hearts"></div>

<div class="stage">
  <div class="card" id="question">
    <div class="eyebrow">para ti</div>
    <h1>¿Puedo ser tu novio?</h1>
    <div class="sub">Solo tienes que responder con el corazón.</div>
    <div class="buttons">
      <button id="yes">Sí, quiero</button>
      <button id="no">No</button>
    </div>
  </div>

  <div class="card" id="final">
    <div class="big-heart">❤️</div>
    <h1 id="finalTitle">Sabía que dirías que sí</h1>
    <div class="sub">A partir de hoy, oficialmente.</div>
  </div>
</div>

<script>
  // Floating background hearts
  const heartsContainer = document.getElementById('hearts');
  const heartEmojis = ['❤️','💗','💕','💞'];
  for(let i=0;i<18;i++){
    const h = document.createElement('div');
    h.className='heart';
    h.textContent = heartEmojis[Math.floor(Math.random()*heartEmojis.length)];
    h.style.left = Math.random()*100+'%';
    h.style.setProperty('--drift', (Math.random()*80-40)+'px');
    h.style.animationDuration = (7+Math.random()*8)+'s';
    h.style.animationDelay = (Math.random()*8)+'s';
    h.style.fontSize = (14+Math.random()*18)+'px';
    heartsContainer.appendChild(h);
  }

  const noBtn = document.getElementById('no');
  const yesBtn = document.getElementById('yes');
  const buttonsWrap = document.querySelector('.buttons');
  let dodges = 0;
  const dodgeMessages = ["¿Segura/o?", "Piénsalo mejor…", "Última oportunidad", "Vamos, inténtalo otra vez"];

  function dodge(){
    const wrap = buttonsWrap.getBoundingClientRect();
    const btn = noBtn.getBoundingClientRect();
    const maxX = wrap.width - btn.width;
    const maxY = 40;
    const x = (Math.random()*maxX) - (maxX/2);
    const y = (Math.random()*maxY) - (maxY/2);
    noBtn.style.position='relative';
    noBtn.style.transform = `translate(${x}px, ${y}px)`;
    if(dodges < dodgeMessages.length){
      noBtn.textContent = dodgeMessages[dodges];
    }
    dodges++;
  }

  noBtn.addEventListener('mouseenter', dodge);
  noBtn.addEventListener('touchstart', function(e){ e.preventDefault(); dodge(); }, {passive:false});
  noBtn.addEventListener('click', function(e){ e.preventDefault(); dodge(); });

  yesBtn.addEventListener('click', () => {
    document.getElementById('question').style.display='none';
    document.getElementById('final').style.display='block';
    burstConfetti();
  });

  function burstConfetti(){
    for(let i=0;i<40;i++){
      setTimeout(()=>{
        const c = document.createElement('div');
        c.className='confetti-heart';
        c.textContent = heartEmojis[Math.floor(Math.random()*heartEmojis.length)];
        c.style.left = Math.random()*100+'%';
        c.style.animationDuration = (3+Math.random()*3)+'s';
        c.style.fontSize = (14+Math.random()*20)+'px';
        heartsContainer.appendChild(c);
        setTimeout(()=>c.remove(), 7000);
      }, i*60);
    }
  }
</script>

</body>
</html>
